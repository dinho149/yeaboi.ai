name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned, labeled]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && github.event.action != 'labeled' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@6b082c41935b4c8a3b8b0ef85ba4ba4d9eeb8975 # v1.0.189
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # Optional: Give a custom prompt to Claude. If this is not specified, Claude will perform the instructions specified in the comment that tagged it.
          # prompt: 'Update the pull request description to include a summary of changes.'

          # Open-ended assistance runs at the `deep` tier (cowork/models.md) — a
          # person is waiting on it. That matches the action's implicit default, so
          # the `||` fallback just pins the prior behaviour. The turn cap is a cost
          # guard against runaway sessions, not a quality lever.
          claude_args: >-
            --model ${{ vars.YEABOI_MODEL_DEEP || 'claude-opus-5' }} --max-turns 50

  # Issue-to-PR: adding the `claude-implement` label to an issue kicks off an
  # implementation run that opens a PR. The PR then flows through ci.yml,
  # claude-review.yml, and auto-version.yml like any human-authored branch.
  implement:
    if: |
      github.event_name == 'issues' &&
      github.event.action == 'labeled' &&
      github.event.label.name == 'claude-implement'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Prompt step 6 makes `make test` + `make lint` this job's own gate. With no
      # toolchain both are `command not found`, so the gate passes by never having
      # run. Mirrors ci.yml's install so there is one answer to "what does CI use".
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - run: uv python install 3.11
      - run: uv sync --extra dev

      # cowork/models.md: "Security never runs on `heavy`." Fable 5 reroutes
      # cybersecurity queries to less capable models — fine for a chat, and
      # unacceptable for an unattended run that may edit fs_policy.py or a CSP
      # invariant, because you would not know which model actually read it.
      # The title is checked as well as the label because a label can be lost:
      # issue #172 had its entire set replaced when the relay applied
      # `claude-implement`, and the `[type][workstream]` prefix cowork-scribe
      # writes at filing time is the copy that survives that.
      - name: Pick the model tier
        id: model
        env:
          LABELS: ${{ toJSON(github.event.issue.labels.*.name) }}
          TITLE: ${{ github.event.issue.title }}
        run: |
          if jq -e 'index("type:security")' <<< "$LABELS" >/dev/null \
            || [[ "$TITLE" == \[security\]* ]]; then
            echo "id=${{ vars.YEABOI_MODEL_DEEP || 'claude-opus-5' }}" >> "$GITHUB_OUTPUT"
            echo "Security issue — running at deep, never heavy."
          else
            echo "id=${{ vars.YEABOI_MODEL_HEAVY || 'claude-opus-5' }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Implement issue
        id: implement
        uses: anthropics/claude-code-action@6b082c41935b4c8a3b8b0ef85ba4ba4d9eeb8975 # v1.0.189
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # This is the one job the `heavy` tier exists for (cowork/models.md):
          # human-selected by adding a label, unattended for up to 110 turns through
          # Linear ticket -> implement -> DoD gate -> code-reviewer -> PR, with CI
          # and a human merge as the net. Everything else in the fleet is shorter or
          # more frequent.
          # The `||` fallback is prior behaviour (the action's implicit Opus-tier
          # default), so an unset variable costs less rather than more.
          # The turn cap went 75 -> 90 when the cowork Definition of Done added the
          # Linear step, and 90 -> 110 when the independent `code-reviewer` pass was
          # added (it was missing, so the propose lane — which by definition builds
          # things outside the auto-lane allowlist — had a weaker gate than the auto
          # lane it dwarfs). A truncated run leaves a half-open PR behind.
          #
          # `--allowedTools` is not optional here and its absence is not benign.
          # The action passes `settingSources: [user, project, local]`, so with no
          # grant of its own this job inherits the repo's `.claude/settings.json`
          # allowlist — which is deliberately read-only, for interactive sessions
          # where a human approves the writes. On 2026-08-09 that combination ran
          # issue #172 for 31 turns, denied all 17 tool calls it needed, and exited
          # `success` having written nothing. Keep this list a superset of what the
          # ten prompt steps below actually invoke.
          claude_args: >-
            --model ${{ steps.model.outputs.id }} --max-turns 110
            --allowedTools "Read,Grep,Glob,Edit,Write,Task,Bash(make:*),Bash(uv run:*),Bash(git:*),Bash(gh issue:*),Bash(gh pr:*),Bash(gh api:*)"
          prompt: |
            Implement GitHub issue #${{ github.event.issue.number }} in ${{ github.repository }}.

            1. Read the issue with `gh issue view ${{ github.event.issue.number }}` (including comments).
            2. Read `cowork/definition-of-done.md` — it is the contract this change must satisfy.
               If the issue carries a `workstream:<name>` label, also Read
               `cowork/workstreams/<name>.md` and stay inside the paths it declares.
            3. DoD item 1, before any code: spawn the `cowork-scribe` agent to open the Linear ticket
               on team `Yeaboi` in state In Progress, labelled with the issue's `workstream:<name>`,
               and to cross-link it with this issue both ways. Approval is when the ticket is
               created — proposals do not get one, because most of them are answered no. Keep the
               identifier for the PR body.

               Linear is an account-scoped connector and this job supplies no `mcp_config`, so the
               tool will often not exist in the runner. If the scribe reports it cannot reach Linear,
               do NOT retry, do not hunt for an API key, and do not substitute another artefact:
               write one line in the PR body saying DoD item 1 is deferred to merge, and carry on.
               `pr-merged-close-loop` runs as a Claude routine with the connectors attached, and
               already creates a missing ticket in Done rather than skipping it.
            4. Create a branch named `feature/issue-${{ github.event.issue.number }}-<short-slug>` off main.
            5. Implement the change following CLAUDE.md conventions (observability pillars,
               TUI component standards, frozen-dataclass defaults, tests for every new function).
               Conventions are split across CLAUDE.md and `.claude/skills/*/SKILL.md` — Read
               the SKILL.md for each area you touch (see the skills index table in CLAUDE.md).
            6. Verify: `make test` and `make lint` must both pass before you commit. If the change
               touches `frontend/`, run `make web` and commit `src/yeaboi/web/static/` in the same
               commit. If it adds a capability, add its `CAPABILITIES` row and its `FeatureTip`.
            7. Review, before opening the PR: spawn the `code-reviewer` agent on
               `git diff main...HEAD` with a one-paragraph description of what the issue asked for.
               Give it the diff and that description only — not your own reasoning, which is what
               makes the review independent. Resolve every finding it reports at `blocker` or
               `should-fix` severity: fix it, or state in the PR body why it is intentionally not
               addressed. This is the same gate `cowork/sweep-procedure.md` puts on the auto lane,
               and the work here is larger than anything the auto lane is allowed to touch.
            8. Commit (lowercase imperative message + the Co-Authored-By trailer from CLAUDE.md),
               push the branch, and open a PR against main whose body summarizes the change,
               lists what was verified, carries a `Closes YEA-NN` line for the ticket from step 3
               (the magic word is what makes the Linear GitHub integration attach the PR and move
               the ticket to Done on merge — a bare Linear URL does neither), notes any DoD item
               that genuinely does not apply, and closes the issue
               (`Closes #${{ github.event.issue.number }}`). If step 3 could not create a ticket,
               write the item-1-deferred-to-merge line instead of the `Closes YEA-NN` line.
            9. Pass the labels to `gh pr create` itself — `--label cowork` plus the issue's
               `workstream:<name>` and `type:<kind>` labels if it had them (the merge ship note
               reads the type off the PR). Labelling in a second step means a run truncated
               between the two leaves an unlabelled bot PR, which `claude-review.yml` then skips
               silently; that is the failure the `cowork` carve-out exists to prevent.
            10. If step 3 produced a ticket, have `cowork-scribe` attach the PR to it and move it
                to In Review. Then comment on the issue with a link to the PR.

            Step 3 and step 10 are the ONLY Linear writes here, and they are the scribe's. Do not
            post to Slack or Notion at all — the `pr-merged-close-loop` cowork routine owns DoD
            items 8 and 9, and it runs on merge.

            If the issue is too ambiguous to implement safely, do NOT guess: comment on the
            issue with the specific questions that need answering, and stop.

      # The failure this job is most prone to, and least able to report, is
      # succeeding at nothing: the run above can deny every write it needs and
      # still finish with `is_error: false`, which GitHub renders as a green
      # check. Nothing else in the fleet would notice — `digest.md` explicitly
      # refuses to age out an issue carrying `claude-implement`, so a silent
      # no-op leaves the issue invisible to every routine. Assert the outcome
      # rather than the exit status.
      - name: Assert the run produced something
        if: always() && steps.implement.conclusion != 'skipped'
        env:
          ISSUE: ${{ github.event.issue.number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          log=/home/runner/work/_temp/claude-execution-output.json
          denials=0
          if [ -f "$log" ]; then
            denials=$(jq '[.. | .permission_denials_count? // empty] | last // 0' "$log")
          fi
          if [ "${denials:-0}" -gt 0 ]; then
            echo "::error::$denials tool call(s) denied — the --allowedTools grant above is wrong."
            exit 1
          fi
          if [ -n "$(git ls-remote --heads origin "refs/heads/feature/issue-$ISSUE-*")" ]; then
            echo "Branch for #$ISSUE pushed."
            exit 0
          fi
          # The prompt's closing instruction is a legitimate no-branch exit: too
          # ambiguous to build safely, so it asks on the issue and stops. That
          # leaves a comment; a broken run leaves nothing, and telling those two
          # apart is the whole point of this check.
          #
          # Bot authors only. The approval that starts this job usually arrives via
          # `cron/slack-relay.md`, which comments `approved via Slack ✅ by …` on the
          # issue seconds beforehand — under a *human* login, because the Slack
          # connector posts as the person. Counting every recent comment would let
          # that one stand in for the exit note and wave through the exact failure
          # this step exists to catch.
          asked=$(gh issue view "$ISSUE" --json comments --jq \
            '[.comments[] | select(.author.login | endswith("[bot]"))
              | select(.createdAt > "'"$(date -u -d '2 hours ago' +%FT%TZ)"'")] | length')
          if [ "${asked:-0}" -gt 0 ]; then
            echo "No branch, but the run commented on #$ISSUE — the documented ambiguous-issue exit."
            exit 0
          fi
          echo "::error::No branch and no comment on #$ISSUE — the run produced nothing."
          exit 1
