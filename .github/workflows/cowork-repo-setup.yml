name: Cowork repo setup

# Apply the cowork GitHub half — the thirty-six labels and the four
# `YEABOI_MODEL_*` repository variables — on every merge that changes what they
# are derived from.
#
# WHY THIS IS A WORKFLOW AND NOT PART OF cd-deploy.
#
# `cron/cd-deploy.md` step 3 was meant to do this, and could not: the routine
# session it runs in reaches GitHub through a proxy that refuses the calls. It
# was probed on 2026-08-11 and the answers are recorded in
# `tests/fixtures/cowork_github_access_live.json` — `GET/PATCH
# /repos/…/actions/variables` comes back
#
#     HTTP 403 Access to this GitHub Actions path is not permitted through this proxy
#
# and no transport changes that: the session has a token, and the token is not
# the problem. So the variables half of step 3 can never succeed there, however
# it is written, and cd-deploy now notes the refusal and carries on to the
# reconcile it *can* do.
#
# An Actions runner has no such proxy. This is where the repo half belongs.
#
# LABELS NEED `issues: write`; VARIABLES NEED A PAT. The default `GITHUB_TOKEN`
# cannot manage Actions variables at all — that is an admin-scoped operation and
# no `permissions:` key grants it. `AUTO_VERSION_PAT` is the fine-grained PAT
# this repo already keeps for the same reason elsewhere; without it the label
# half still runs and the variable half is reported, loudly, rather than
# silently skipped.

on:
  push:
    branches: [main]
    paths:
      - 'cowork/**'
      - 'scripts/cowork_setup.py'
      - '.github/workflows/cowork-repo-setup.yml'
  # A merge is the trigger that matters; this is the way to re-run it by hand
  # after fixing the PAT, without an empty commit.
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: cowork-repo-setup
  cancel-in-progress: false

jobs:
  apply:
    name: Labels and model variables
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - run: uv python install 3.11
      - run: uv sync --extra dev

      - name: Warn when the variable half cannot run
        env:
          HAS_PAT: ${{ secrets.AUTO_VERSION_PAT != '' }}
        run: |
          if [ "$HAS_PAT" != "true" ]; then
            echo "::warning::AUTO_VERSION_PAT is not set — labels will be applied, but the four YEABOI_MODEL_* repository variables cannot be, because GITHUB_TOKEN has no admin scope. cowork/models.md and the live variables may drift with nothing else reporting it."
          fi

      # `--strict` so a rejected write is a failed job rather than a note on a
      # log nobody reads. That is the whole lesson of the cd-deploy no-op: it
      # exited 0 for weeks while doing nothing.
      #
      # But only when the variable half can actually run. Without the PAT,
      # `GITHUB_TOKEN` has no admin scope, the variables read 403s, and `--strict`
      # turns a *known and already warned-about* prerequisite into a red job on
      # every `cowork/` merge — which teaches the same lesson backwards: a check
      # that is always red is a check nobody reads either. The step above says
      # this half is "reported, loudly, rather than silently skipped"; this keeps
      # that true.
      - name: Apply
        env:
          GH_TOKEN: ${{ secrets.AUTO_VERSION_PAT || github.token }}
          HAS_PAT: ${{ secrets.AUTO_VERSION_PAT != '' }}
        run: |
          if [ "$HAS_PAT" = "true" ]; then
            uv run python scripts/cowork_setup.py --strict
          else
            uv run python scripts/cowork_setup.py
          fi

      # Reports the account half as unchecked (no --triggers snapshot here — the
      # routines API is not reachable from an Actions runner). Repo half only,
      # which is exactly what this job just applied.
      - name: Verify
        env:
          GH_TOKEN: ${{ secrets.AUTO_VERSION_PAT || github.token }}
        run: uv run python scripts/cowork_setup.py --check
