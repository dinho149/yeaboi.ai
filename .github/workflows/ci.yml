name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least-privilege token — these jobs only check out code and run tests.
permissions:
  contents: read

# Cancel in-progress runs on the same branch when a new push arrives.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Fast gate ────────────────────────────────────────────────────────────
  # Unit tests — also enforced locally by the pre-commit hook in
  # .pre-commit-config.yaml. Running them in CI too catches contributors
  # who haven't installed pre-commit.
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - run: uv python install 3.11
      - run: uv sync --extra dev
      - run: make test-fast

  # ── Slow suite ───────────────────────────────────────────────────────────
  # Integration + contract tests (marked @pytest.mark.slow) — too slow for
  # pre-commit but must pass before any PR merges. All external calls are
  # mocked or VCR-replayed; no real API keys required.
  integration:
    name: Integration & contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - run: uv python install 3.11
      - run: uv sync --extra dev
      - run: make test

  # ── Go core (the yeaboi-core sidecar) ────────────────────────────────────
  # Build + vet + test the Go tree, then hand the binary to the parity job.
  # The binary is never committed; this is where it comes from.
  go:
    name: Go core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - run: make go-lint
      - run: make go-test
      - run: make go-build
      - uses: actions/upload-artifact@v4
        with:
          name: yeaboi-core
          path: bin/yeaboi-core
          retention-days: 1
      # The yeaboi[core] wheel end-to-end: build it for this platform via the
      # hatch_build.py hook, install it into a clean venv, and prove the two
      # things a user's install depends on — binary_path() resolves inside the
      # wheel and the binary answers core.hello. publish-core.yml builds with
      # the same hook, so a hook regression fails PRs here, not the release.
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - name: Wheel smoke (yeaboi-core)
        run: |
          uv python install 3.12
          uv build --wheel packaging/yeaboi-core -o dist-core
          uv venv --python 3.12 wheel-smoke-venv
          uv pip install --python wheel-smoke-venv/bin/python dist-core/*.whl
          wheel-smoke-venv/bin/python - <<'EOF'
          import json, subprocess
          from yeaboi_core import binary_path
          path = binary_path()
          proc = subprocess.run(
              [path], input='{"jsonrpc": "2.0", "id": 1, "method": "core.hello", "params": {}}\n',
              capture_output=True, text=True, timeout=30, check=True,
          )
          result = json.loads(proc.stdout.splitlines()[0])["result"]
          assert result["contract_version"] == 1, result
          print(f"wheel smoke ok: {path} -> {result['name']} {result['version']}")
          EOF

  # ── Python ↔ Go parity ───────────────────────────────────────────────────
  # tests/parity skips itself when the binary is absent (keeping `make test`
  # pytest-only); HERE it runs unskipped, so implementation drift can't merge.
  parity:
    name: Python ↔ Go parity
    runs-on: ubuntu-latest
    needs: go
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - run: uv python install 3.11
      - run: uv sync --extra dev
      - uses: actions/download-artifact@v4
        with:
          name: yeaboi-core
          path: bin
      - run: chmod +x bin/yeaboi-core
      - run: YEABOI_CORE_BIN=$PWD/bin/yeaboi-core uv run pytest tests/parity -v

  # ── Golden evaluators ────────────────────────────────────────────────────
  # LLM-output quality checks against the golden dataset.
  # Kept separate so a quality regression doesn't block unrelated PRs.
  eval:
    name: Golden evaluators
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - run: uv python install 3.11
      - run: uv sync --extra dev
      - run: make eval

  # ── Code quality ─────────────────────────────────────────────────────────
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - run: uv python install 3.11
      - run: uv sync --extra dev
      - run: make lint

  format-check:
    name: Format check (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - run: uv python install 3.11
      - run: uv sync --extra dev
      - run: uv run ruff format --check src/ tests/

  # ── Front end ────────────────────────────────────────────────────────────
  # The bundles in src/yeaboi/web/static are COMMITTED so that installing
  # yeaboi never requires Node — which means nothing else in CI would notice
  # if they drifted from frontend/. This job is the only thing that would.
  web:
    name: Front-end bundles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: make web-install
      # Typechecks, rebuilds, and fails if the result differs from what is
      # committed. The usual cause is "edited frontend/ and forgot `make web`".
      - run: make web-check

  # ── Docs site ────────────────────────────────────────────────────────────
  # docs/ is published as yeaboi.ai by GitHub Pages straight off main. There is
  # no deploy step that could fail, so a stale SEO block, a wrong canonical or a
  # dropped sitemap entry ships silently. tests/unit/test_site_seo.py asserts
  # the same thing in the unit lane; this job exists so the failure gets its own
  # named red check pointing at the one command that fixes it.
  site:
    name: Docs site (SEO block, sitemap, robots)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - run: uv python install 3.11
      - run: uv sync --extra dev
      - run: make site-check

  # Assert the committed bundles actually make it into the built wheel.
  # .gitignore contains unanchored `dist/` and `build/` globs and hatchling
  # loads it as build excludes, so this class of mistake produces a wheel that
  # builds cleanly and then ImportErrors on the user's machine. Cheap insurance.
  package:
    name: Wheel contains the bundles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - run: uv python install 3.11
      - run: uv build
      - name: Assert bundles are packaged
        run: |
          python - <<'PY'
          import pathlib, sys, tarfile, zipfile

          required = {"yeaboi/web/static/export.js", "yeaboi/web/static/export.css"}

          wheel = next(pathlib.Path("dist").glob("*.whl"))
          names = set(zipfile.ZipFile(wheel).namelist())
          missing = {n for n in required if n not in names}
          if missing:
              sys.exit(f"wheel {wheel.name} is missing {sorted(missing)}")

          sdist = next(pathlib.Path("dist").glob("*.tar.gz"))
          with tarfile.open(sdist) as tf:
              members = {m.name.split("/", 1)[1] for m in tf.getmembers() if "/" in m.name}
          # The sdist carries the TS sources too, so a release is reproducible.
          for want in {"src/" + n for n in required} | {"frontend/package.json"}:
              if want not in members:
                  sys.exit(f"sdist {sdist.name} is missing {want}")
          print(f"✓ {wheel.name} and {sdist.name} carry the bundles")
          PY

  # ── Security ─────────────────────────────────────────────────────────────
  # SAST (ruff flake8-bandit "S" rules) + dependency CVE audit (pip-audit
  # against the committed uv.lock) + secret scanning (gitleaks). Mirrors the
  # `make security` target contributors can run locally.
  security:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so gitleaks can scan all commits on a PR, not just the tip.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - run: uv python install 3.11
      - run: uv sync --extra dev
      - name: SAST + dependency audit
        run: make security
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
