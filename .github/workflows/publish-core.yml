name: Publish yeaboi-core to PyPI

# Auto-release of the Go sidecar's platform wheels on version bump — the same
# model as publish.yml: on every push to main, publish *iff* the version in
# packaging/yeaboi-core/pyproject.toml has no matching `core-v*` tag yet. So
# releasing the sidecar is: bump binaryVersion in go/cmd/yeaboi-core/main.go
# AND the packaging version together (tests/unit/test_gocore_packaging.py
# forces them to move in lockstep) and merge. Normal merges are a cheap no-op.
#
# The workflow filename MUST stay "publish-core.yml" — it is named in PyPI's
# OIDC trusted-publisher configuration for the yeaboi-core project.
#
# Wheels only, no sdist: the sdist would need the whole repo plus a Go
# toolchain to build, so publishing one would turn "unsupported platform" from
# a clear resolver error into a confusing build failure.
on:
  push:
    branches: [main]
  workflow_dispatch: {} # allow a manual re-run from the Actions tab

permissions:
  contents: read

jobs:
  check:
    name: Check for core version bump
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.v.outputs.should_release }}
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # need full history + tags to check for an existing release
      - id: v
        run: |
          VERSION=$(grep -m1 -E '^version = ' packaging/yeaboi-core/pyproject.toml | sed -E 's/^version = "([^"]+)".*/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/core-v$VERSION" >/dev/null; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "::notice::core-v$VERSION is already released — nothing to publish."
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "::notice::New sidecar version core-v$VERSION detected — building and publishing."
          fi

  publish:
    name: Build platform wheels & publish
    needs: check
    if: needs.check.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # PyPI trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - run: uv python install 3.12
      - run: make go-lint && make go-test
      # Pure Go + CGO_ENABLED=0: one runner cross-compiles every target. The
      # target list lives in hatch_build.py (WHEEL_TAGS) and is pinned by
      # tests/unit/test_gocore_packaging.py.
      - name: Build all platform wheels
        run: |
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            YEABOI_CORE_TARGET=$target uv build --wheel packaging/yeaboi-core -o dist-core
          done
          ls -l dist-core
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist-core
          skip-existing: true # idempotent: re-runs won't fail if already published

  release:
    name: Tag core release
    needs: [check, publish]
    if: needs.check.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the tag + GitHub Release
    steps:
      - uses: actions/checkout@v7
      - name: Create tag and GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: core-v${{ needs.check.outputs.version }}
          name: yeaboi-core v${{ needs.check.outputs.version }}
          generate_release_notes: false # notes would be the whole repo's; the wheel is one binary
