repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      # src/yeaboi/web/static/ is Vite output. end-of-file-fixer would append a
      # newline Vite did not write, so every `make web` would leave a permanent
      # diff and `make web-check` would fail in CI. Same reasoning for
      # trailing-whitespace and the 500 KB size gate.
      - id: trailing-whitespace
        exclude: \.ambr$|^src/yeaboi/web/static/
      - id: end-of-file-fixer
        exclude: ^src/yeaboi/web/static/
      - id: check-yaml
      - id: check-added-large-files
        exclude: ^src/yeaboi/web/static/
      - id: check-merge-conflict

  # ruff also enforces the flake8-bandit "S" SAST rules (see pyproject `select`).
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.2
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # Secret scanning — stop a credential from ever being committed.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  # Run the unit tests this change touches before every commit, in parallel.
  # Integration + contract tests run in CI on every PR — see .github/workflows/ci.yml.
  #
  # Scoped rather than the whole lane: 11,000 tests on every commit is a gate
  # people learn to pass with --no-verify. `scripts/test_scope.py` picks the
  # areas the staged files touch plus the always-run repo guards, and widens to
  # everything whenever it cannot classify a path — so the narrowing can cost
  # time, never coverage.
  - repo: local
    hooks:
      - id: unit-tests
        name: Unit tests
        language: system
        entry: make test-scoped
        pass_filenames: false
        files: \.py$
