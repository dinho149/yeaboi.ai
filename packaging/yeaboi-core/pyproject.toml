[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yeaboi-core"
# Mirrors binaryVersion in go/cmd/yeaboi-core/main.go — a unit test
# (tests/unit/test_gocore_packaging.py) fails the main suite if they drift.
# Versioned independently of the yeaboi package: the real compatibility gate
# is the contract_version handshake in src/yeaboi/gocore/client.py.
version = "0.1.0"
description = "Prebuilt yeaboi-core sidecar binary for yeaboi. Install via yeaboi[core]."
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Omar Din"}]
license = {text = "MIT"}
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Go",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.urls]
Homepage = "https://yeaboi.ai"
Source = "https://github.com/yeaboi-ai/yeaboi"

[tool.hatch.build.targets.wheel]
packages = ["src/yeaboi_core"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"
