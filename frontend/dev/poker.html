<!doctype html>
<!--
  Dev-server shell for the `poker` entry. NEVER built — Vite's lib mode ignores
  HTML entirely; this exists so `make web-dev` can render the board with HMR
  against a real server.

    make dev-poker                       # terminal 1 — seeded board + API on :5273
    YEABOI_DEV_API=http://127.0.0.1:5273 make web-dev   # terminal 2 — Vite on :5399

  Then open http://localhost:5399/dev/poker.html?token=<token> — or append
  &admin=<secret> for the host view.

  `make dev-poker` has existed for a while with nowhere to point a browser,
  which is a large part of why poker and the deck drifted furthest from the
  export shell: the only way to look at a change was to rebuild the bundle and
  restart the Python server.

  The JSON island mirrors what poker/page.py's board_config() emits. It is
  deliberately a *short* list of channels and names: the point is to exercise
  the shape, and a divergence in the words would not tell you anything. The
  card values are NOT here — they are codegen'd into types/enums.ts, because a
  deck the server would reject is worse than no deck.
-->
<html lang="en" data-mode="poker">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Planning Poker — dev</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="application/json" id="yeaboi-data">
      {
        "chrome": {
          "mode": "poker",
          "frame": "yeaboi — poker",
          "wordmark": "poker",
          "title": "Planning Poker",
          "subtitle": "yeaboi",
          "facts": [["PROJECT", "yeaboi"], ["SCOPE", "Sprint 42"]],
          "footer": "Generated by yeaboi.ai"
        },
        "scope": "Sprint 42",
        "adjectives": ["Cosmic", "Sneaky", "Turbo", "Velvet"],
        "nouns": ["Llama", "Wizard", "Raccoon", "Yeti"],
        "musicChannels": [
          { "name": "Lofi", "url": "https://ice2.somafm.com/fluid-128-mp3" },
          { "name": "Ambient", "url": "https://ice2.somafm.com/dronezone-128-mp3" }
        ]
      }
    </script>
    <script type="module" src="/src/poker/main.tsx"></script>
  </body>
</html>
