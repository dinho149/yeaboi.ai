<!doctype html>
<!--
  Dev-server shell for the `deck` entry. NEVER built — Vite's lib mode ignores
  HTML entirely; this exists so `make web-dev` can render the slide deck with
  HMR.

    make web-dev       # Vite on :5399 — no Python server needed

  Then open http://localhost:5399/dev/deck.html.

  The deck needs no API: an exported deck is a single file with its whole
  payload in the island, so this shell is the *complete* input the component
  ever sees. That also makes it the only surface whose dev shell can drift
  silently — there is no server to disagree with. `test_web_wire_shapes.py`
  writes the real payload to frontend/src/test/fixtures/deck.json and wire.ts
  asserts it `satisfies` DeckBoot; when this island and that fixture disagree,
  the fixture is right.

  Three slides rather than eight, chosen for the layouts that differ most. All
  four shipped palettes are kept so the picker has something to cycle: the deck
  palette contributes an accent on top of whichever site theme is stored, and
  the interesting cases are the light ones.
-->
