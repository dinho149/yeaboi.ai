<!doctype html>
<!--
  Dev-server shell for the `ship` entry. NEVER built — this exists so
  `make web-dev` can render the board with HMR against a real ship server.

    make dev-ship      # terminal 1 — seeded board + API on :5473, prints a token
    make web-dev       # terminal 2 — Vite on :5399, proxying /api to it

  Then open http://localhost:5399/dev/ship.html?token=<token>.

  The JSON island mirrors what ship/page.py's board_config() emits.
-->
<html lang="en" data-mode="ship">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ship — dev</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="application/json" id="yeaboi-data">
      {
        "chrome": {
          "mode": "ship",
          "frame": "yeaboi — ship",
          "wordmark": "ship",
          "title": "Ship",
          "subtitle": "Add a rate limiter",
          "facts": [["PROJECT", "yeaboi"], ["STORY", "Add a rate limiter"]],
          "footer": "Generated by yeaboi.ai"
        },
        "story": "Add a rate limiter",
        "project": "yeaboi"
      }
    </script>
    <script type="module" src="/src/ship/main.tsx"></script>
  </body>
</html>
