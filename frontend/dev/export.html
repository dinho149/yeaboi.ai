<!doctype html>
<!--
  Dev-server shell for the `export` entry. NEVER built — Vite's lib mode ignores
  HTML entirely; this exists only so `make web-dev` can render the export
  stylesheet with HMR while iterating on tokens.css.

  The markup mirrors what html_theme.html_page emits, so what you see here is
  what an exported report looks like.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>export tokens — dev</title>
  </head>
  <body>
    <script type="module" src="/src/export/main.ts"></script>
    <header class="site-header">
      <h1>Sprint 42 — Delivery Report</h1>
      <div class="subtitle">Every primitive html_theme can emit, on one page.</div>
      <div class="meta">
        <span>Generated 2026-07-29</span>
        <span class="badge badge-accent">yeaboi</span>
        <button class="theme-btn" onclick="__yeaboiCycleTheme()" title="Switch theme">◐ theme</button>
      </div>
    </header>
    <nav class="toc"><a href="#one">Overview</a><a href="#two">Detail</a></nav>
    <div class="container">
      <section id="one">
        <h2>Overview</h2>
        <div class="stat-grid">
          <div class="stat"><div class="num">42</div><div class="lbl">points delivered</div></div>
          <div class="stat"><div class="num">7</div><div class="lbl">stories closed</div></div>
          <div class="stat"><div class="num">91%</div><div class="lbl">sprint goal</div></div>
        </div>
        <div class="capacity-bar"><div class="capacity-fill" style="width:72%;background:var(--accent)"></div></div>
        <p>
          <span class="badge badge-ok">ok</span>
          <span class="badge badge-warn">warn</span>
          <span class="badge badge-danger">danger</span>
          <span class="badge badge-info">info</span>
          <span class="badge badge-tag">neutral</span>
        </p>
      </section>
      <section id="two">
        <h2>Detail</h2>
        <table>
          <thead><tr><th>Ticket</th><th>Owner</th><th>Points</th></tr></thead>
          <tbody>
            <tr><td>PROJ-101</td><td>Ada</td><td>5</td></tr>
            <tr><td>PROJ-102</td><td>Grace</td><td>3</td></tr>
          </tbody>
        </table>
      </section>
    </div>
    <footer class="site-footer">Generated by yeaboi.ai</footer>
  </body>
</html>
