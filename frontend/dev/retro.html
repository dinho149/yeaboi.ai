<!doctype html>
<!--
  Dev-server shell for the `retro` entry. NEVER built — Vite's lib mode ignores
  HTML entirely; this exists so `make web-dev` can render the board with HMR
  against a real server.

    make dev-board     # terminal 1 — seeded board + API on :5173, prints a token
    make web-dev       # terminal 2 — Vite on :5399, proxying /api to it

  Then open http://localhost:5399/dev/retro.html?token=<token> — or append
  &admin=<secret> for the host view.

  The JSON island mirrors what retro/page.py's board_config() emits. It is
  deliberately a *short* list of channels and names: the point is to exercise
  the shape, and a divergence in the words would not tell you anything.
-->
<html lang="en" data-mode="retro">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sprint Retro — dev</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="application/json" id="yeaboi-data">
      {
        "chrome": {
          "mode": "retro",
          "frame": "yeaboi \u2014 retro",
          "wordmark": "retro",
          "title": "Sprint Retro",
          "subtitle": "Sprint 42",
          "facts": [["PROJECT", "yeaboi"], ["SPRINT", "Sprint 42"]],
          "footer": "Generated by yeaboi.ai"
        },
        "sprint": "Sprint 42",
        "adjectives": ["Cosmic", "Sneaky", "Turbo", "Velvet"],
        "nouns": ["Llama", "Wizard", "Raccoon", "Yeti"],
        "musicChannels": [
          { "name": "Lofi", "url": "https://ice2.somafm.com/fluid-128-mp3" },
          { "name": "Ambient", "url": "https://ice2.somafm.com/dronezone-128-mp3" }
        ]
      }
    </script>
    <script type="module" src="/src/retro/main.tsx"></script>
  </body>
</html>
